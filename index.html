<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Simulador 3D da casa para testar móveis, cores e decoração.">
<meta name="theme-color" content="#f5f2ec">
<title>Minha casa 3D — simulador de decoração</title>
<style>
  :root{
    --paper:#f5f2ec; --ink:#1f1c18; --muted:#6f685e; --line:#ddd6ca;
    --accent:#b8502b; --accent-ink:#fff; --card:#fffdf9;
    --shadow:0 6px 24px rgba(40,30,20,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe0ee;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

  .top{position:fixed;left:0;right:0;top:0;padding:10px 8px 0;display:flex;justify-content:center;pointer-events:none;z-index:5}
  .seg{pointer-events:auto;display:flex;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);gap:2px}
  .seg button{padding:8px 11px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
  .seg button.on{background:var(--ink);color:#fff}

  .hint{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:rgba(31,28,24,.82);color:#fff;
    padding:7px 12px;border-radius:999px;font-size:13px;z-index:5;pointer-events:none;white-space:nowrap;
    max-width:94vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
  .hint.off{opacity:0}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;justify-content:center;pointer-events:none}
  .bar button{pointer-events:auto;flex:1;max-width:150px;background:var(--card);border-radius:14px;padding:10px 6px 9px;
    box-shadow:var(--shadow);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bar button.primary{background:var(--accent);color:var(--accent-ink)}
  .bar button.on{background:var(--ink);color:#fff}

  .sel,.paintbar{position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;background:var(--card);
    border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:none;max-width:520px;margin:0 auto}
  .sel.show,.paintbar.show{display:block}
  .sel .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .sel .name b{font-size:15px}
  .sel .name span{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .acts{display:flex;gap:5px}
  .acts button{flex:1;background:#efeae1;border-radius:10px;padding:9px 2px;font-size:12.5px;font-weight:600}
  .acts button.danger{color:#a3271b}
  .acts button.on{background:var(--ink);color:#fff}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sel .extra{margin-top:10px;display:none}
  .sel .extra.show{display:flex}
  .elev{align-items:center;gap:8px}
  .elev span{flex:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .elev button{background:#efeae1;border-radius:10px;padding:8px 14px;font-weight:700}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.14);flex:none}
  .sw.on{outline:3px solid var(--ink);outline-offset:2px}
  .paintbar .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
  .paintbar .t button{font-weight:700;color:var(--accent);font-size:13px}

  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-radius:20px 20px 0 0;
    box-shadow:0 -10px 40px rgba(40,30,20,.25);transform:translateY(105%);transition:transform .25s ease;
    max-height:74vh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom)}
  .sheet.show{transform:none}
  .sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .sheet header h2{margin:0;font-size:17px}
  .sheet header button{background:#e9e3d8;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;flex:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;padding:7px 13px;border-radius:999px;background:#e9e3d8;font-weight:600;font-size:13px;color:var(--muted)}
  .tabs button.on{background:var(--ink);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:2px 16px 18px;overflow-y:auto}
  .grid button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 9px;text-align:center}
  .grid img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
  .grid b{display:block;font-size:12.5px;line-height:1.2}
  .grid span{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .body{padding:2px 16px 18px;overflow-y:auto}
  .body h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
  .body p{margin:0 0 6px;color:var(--muted);font-size:13px;line-height:1.4}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .list button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;font-weight:600}
  .list button small{display:block;font-weight:400;color:var(--muted);margin-top:2px;font-size:12.5px}
  .list button.danger{color:#a3271b}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="top"><div class="seg" id="views">
  <button data-v="orbit" class="on">Maquete</button>
  <button data-v="top">Planta</button>
  <button data-v="walk">Por dentro</button>
  <button data-v="out">Fachada</button>
</div></div>
<div class="hint" id="hint"></div>

<div class="sel" id="sel">
  <div class="name"><b id="selName"></b><span id="selDim"></span></div>
  <div class="acts">
    <button id="rotL" aria-label="Girar à esquerda">⟲</button>
    <button id="rotR" aria-label="Girar à direita">⟳</button>
    <button id="colorBtn">Cor</button>
    <button id="elevBtn">Altura</button>
    <button id="dupBtn">Duplicar</button>
    <button id="delBtn" class="danger">Remover</button>
  </div>
  <div class="swatches extra" id="selSw"></div>
  <div class="elev extra" id="elevRow"><span id="elevTxt"></span><button id="elevDown">−</button><button id="elevUp">+</button><button id="elevZero">Padrão</button></div>
</div>

<div class="paintbar" id="paintbar">
  <div class="t"><span>Escolha a cor e toque numa parede</span><button id="paintAll">Pintar todas</button></div>
  <div class="swatches" id="paintSw"></div>
</div>

<div class="bar">
  <button class="primary" id="bAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Móveis</button>
  <button id="bPaint"><svg viewBox="0 0 24 24"><path d="M4 4h13v6H4zM17 7h3v6h-8v3M12 16v4"/></svg>Pintar</button>
  <button id="bWalls"><svg viewBox="0 0 24 24"><path d="M3 20V9l9-5 9 5v11M3 20h18M9 20v-6h6v6"/></svg><span id="wallsLbl">Paredes</span></button>
  <button id="bMore"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Mais</button>
</div>

<div class="sheet" id="catSheet">
  <header><h2>Adicionar móvel</h2><button data-close>Fechar</button></header>
  <div class="tabs" id="catTabs"></div>
  <div class="grid" id="catGrid"></div>
</div>

<div class="sheet" id="moreSheet">
  <header><h2>Opções</h2><button data-close>Fechar</button></header>
  <div class="body">
    <h3>Piso</h3>
    <div class="row" id="floorRow"></div>
    <h3>Exibir</h3>
    <div class="row">
      <button class="chip" id="roofChip">Telhado</button>
      <button class="chip" id="muroChip">Muro e portão</button>
      <button class="chip" id="lblChip">Medidas dos cômodos</button>
    </div>
    <h3>Projeto</h3>
    <div class="list">
      <button id="sample">Carregar sugestão de layout<small>Mobília a casa e o quintal como ponto de partida. Substitui os móveis atuais.</small></button>
      <button id="clear" class="danger">Remover todos os móveis<small id="clearNote">A pintura e o piso são mantidos.</small></button>
    </div>
    <p>Seu projeto fica salvo neste aparelho automaticamente.</p>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const canvas=$('#gl');
if(!window.THREE){ $('#hint').textContent='Não foi possível carregar o motor 3D.'; return; }
const PI=Math.PI;

/* ───────── Medidas da planta (metros) ───────── */
const T=0.12, H=2.6, LOW=1.0;
const W=5.99, D=8.58;                       // casa (externo)
const CX=W/2, CZ=D/2;
const CAL={x0:-.6,z0:-.63,z1:D+.6};          // calçada da planta: 0,60 esquerda/frente · 0,63 fundos
const LOT={x0:-2.2,x1:W,z0:-3.6,z1:D+5.6};   // terreno (estimado)
const ROOMS=[
  {n:'Quarto I',     x0:.12,x1:2.94,z0:.12, z1:3.37},
  {n:'Banheiro',     x0:.12,x1:1.94,z0:3.49,z1:4.99},
  {n:'Quarto II',    x0:.12,x1:2.94,z0:5.11,z1:8.46},
  {n:'Cozinha',      x0:3.06,x1:5.87,z0:1.55,z1:4.09},
  {n:'Sala',         x0:3.06,x1:5.87,z0:4.21,z1:8.46},
  {n:'Área de serviço',x0:3.06,x1:5.87,z0:0,z1:1.43}
];

/* ───────── Estado ───────── */
const KEY='casa3d-v1';
let state={items:[],paints:{},floor:'tile',low:true,labels:true,roof:false,muro:true};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.items)) state=Object.assign(state,s); }catch(e){}
let saveT=0;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} },250); }

/* ───────── Renderizador (desenha só quando algo muda) ───────── */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.05,260);
let dirty=true; const inv=()=>{dirty=true;};
['click','pointerdown','pointerup','transitionend'].forEach(e=>document.addEventListener(e,inv,true));

function canvasTex(size,draw,rep){
  const c=document.createElement('canvas'); c.width=c.height=size; draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); t.userData.m=rep; return t;
}
function noise(g,s,a,n,sz){ for(let i=0;i<n;i++){ const v=Math.random()<.5?0:255; g.fillStyle=`rgba(${v},${v},${v},${a*Math.random()})`; g.fillRect(Math.random()*s,Math.random()*s,sz||2,sz||2);} }

/* céu + iluminação ambiente por reflexo (IBL) */
const gradTex=st=>{ const c=document.createElement('canvas'); c.width=4; c.height=256; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256); st.forEach(k=>gr.addColorStop(k[0],k[1]));
  g.fillStyle=gr; g.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; };
const skyTex=gradTex([[0,'#4f93d6'],[.38,'#9cc7ea'],[.5,'#e4eef5'],[.505,'#d9cfb6'],[1,'#bfb499']]);
const sky=new THREE.Mesh(new THREE.SphereGeometry(120,24,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,depthWrite:false,fog:false}));
sky.position.set(CX,0,CZ); scene.add(sky);
(function(){ const es=new THREE.Scene(); es.add(new THREE.Mesh(sky.geometry,new THREE.MeshBasicMaterial({map:gradTex([[0,'#dfe6ee'],[.45,'#f6f4ef'],[.5,'#fbf7ee'],[.51,'#e6dfd0'],[1,'#cfc6b4']]),side:THREE.BackSide})));
  const glow=new THREE.Mesh(new THREE.SphereGeometry(9,12,8),new THREE.MeshBasicMaterial({color:new THREE.Color(9,8,6.5)})); glow.position.set(-40,75,55); es.add(glow);
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(es,.03).texture; pm.dispose(); })();

scene.add(new THREE.HemisphereLight(0xffffff,0xe6dccb,.6));
const sun=new THREE.DirectionalLight(0xfff1dc,2.7);
sun.position.set(CX-7,15,CZ+10); sun.target.position.set(CX,0,CZ+1);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:13,bottom:-13,near:1,far:50});
sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.025; sun.shadow.radius=3; sun.shadow.autoUpdate=false;
scene.add(sun,sun.target);
function shade(){ sun.shadow.needsUpdate=true; dirty=true; }

/* ───────── Texturas e materiais ───────── */
const Mat=THREE.MeshStandardMaterial;
const grain=canvasTex(256,(g,s)=>{ g.fillStyle='#fff'; g.fillRect(0,0,s,s); for(let i=0;i<90;i++){ g.fillStyle=`rgba(60,30,10,${.03+Math.random()*.09})`; const y=Math.random()*s; g.fillRect(0,y,s,1+Math.random()*2.5);} noise(g,s,.04,700); },1);
const fabric=canvasTex(128,(g,s)=>{ g.fillStyle='#fff'; g.fillRect(0,0,s,s); for(let i=0;i<s;i+=2){ g.fillStyle='rgba(0,0,0,.05)'; g.fillRect(i,0,1,s); g.fillRect(0,i,s,1);} noise(g,s,.08,1500); },1); fabric.repeat.set(3,3);
const FLOORS={
  tile:{n:'Porcelanato claro',rough:.34,tex:canvasTex(256,(g,s)=>{ g.fillStyle='#f3f1ec'; g.fillRect(0,0,s,s); noise(g,s,.035,900,3); g.strokeStyle='#c9c5bc'; g.lineWidth=4; g.strokeRect(0,0,s,s); },0.46)},
  wood:{n:'Madeira',rough:.5,tex:canvasTex(512,(g,s)=>{ const rows=6,h=s/rows,cs=['#b98a5e','#c2946a','#ad7f55','#bd8d62','#b4855a','#c69a70'];
      for(let r=0;r<rows;r++){ const off=(r%2)*s/2; for(let k=-1;k<2;k++){ g.fillStyle=cs[(r*2+k+6)%6]; g.fillRect(off+k*s,r*h,s,h); g.fillStyle='rgba(60,35,15,.35)'; g.fillRect(off+k*s,r*h,2,h);} g.fillStyle='rgba(60,35,15,.3)'; g.fillRect(0,r*h,s,2);
        for(let i=0;i<18;i++){ g.fillStyle='rgba(70,40,15,.08)'; g.fillRect(Math.random()*s,r*h+Math.random()*h,60+Math.random()*120,1.5);} } },1.3)},
  cement:{n:'Cimento queimado',rough:.4,tex:canvasTex(256,(g,s)=>{ g.fillStyle='#a9a9a6'; g.fillRect(0,0,s,s); for(let i=0;i<60;i++){ const v=Math.random()<.5?255:60; g.fillStyle=`rgba(${v},${v},${v},.035)`; g.beginPath(); g.arc(Math.random()*s,Math.random()*s,10+Math.random()*40,0,7); g.fill(); } noise(g,s,.05,1500); },2.2)},
  dark:{n:'Porcelanato grafite',rough:.28,tex:canvasTex(256,(g,s)=>{ g.fillStyle='#55585c'; g.fillRect(0,0,s,s); noise(g,s,.05,1200,3); g.strokeStyle='#3d4043'; g.lineWidth=3; g.strokeRect(0,0,s,s); },0.6)},
  marble:{n:'Mármore branco',rough:.22,tex:canvasTex(512,(g,s)=>{ g.fillStyle='#f4f3f1'; g.fillRect(0,0,s,s); g.lineCap='round'; for(let i=0;i<14;i++){ g.strokeStyle=`rgba(120,125,135,${.08+Math.random()*.16})`; g.lineWidth=.6+Math.random()*2; g.beginPath(); let x=Math.random()*s,y=Math.random()*s; g.moveTo(x,y); for(let k=0;k<8;k++){ x+=20+Math.random()*60; y+=(Math.random()-.5)*70; g.lineTo(x,y);} g.stroke(); } g.strokeStyle='#d4d2cd'; g.lineWidth=3; g.strokeRect(0,0,s,s); },0.9)}
};
const floorMat=new Mat({roughness:.2,metalness:0,envMapIntensity:1});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),floorMat);
floor.rotation.x=-PI/2; floor.position.set(CX,0,CZ); floor.receiveShadow=true; scene.add(floor);
function setFloor(k){ if(!FLOORS[k])k='tile'; state.floor=k; const f=FLOORS[k]; f.tex.repeat.set(W/f.tex.userData.m,D/f.tex.userData.m); floorMat.map=f.tex; floorMat.roughness=f.rough; floorMat.needsUpdate=true; inv(); }

const mcache={};
const M=(c,o)=>{ const k=c+JSON.stringify(o||''); return mcache[k]||(mcache[k]=new Mat(Object.assign({color:c,roughness:.7},o||{}))); };
const WOOD='#a9794f', WOODD='#5c4033', WHITE='#f4f2ee', BLACK='#1c1c1e', INOX='#c6c9cd', DARK='#2b2a28';
const MW=new Mat({color:WOOD,map:grain,roughness:.6}), MWD=new Mat({color:WOODD,map:grain,roughness:.6});
const CHROME=M('#c9ccd0',{metalness:.9,roughness:.25}), GRAN=M('#44474c',{roughness:.22}), SCREEN=M('#18202b',{roughness:.08,metalness:.3});
const GLASSD=M('#27303a',{roughness:.08,metalness:.4}), MIRROR=M('#cfdde2',{metalness:1,roughness:.04}), SEAM=M('#000000',{transparent:true,opacity:.3});

/* ───────── Terreno, calçada, muro ───────── */
const ext=new THREE.Group(); scene.add(ext);
const muroRoot=new THREE.Group(); scene.add(muroRoot);
(function(){
  const rec=(w,d,x,z,y,m)=>{ const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m); o.rotation.x=-PI/2; o.position.set(x,y,z); o.receiveShadow=true; ext.add(o); return o; };
  const box=(w,h,d,x,y,z,m,par)=>{ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y+h/2,z); o.castShadow=o.receiveShadow=true; (par||ext).add(o); return o; };
  const lw=LOT.x1-LOT.x0, ld=LOT.z1-LOT.z0, lcx=(LOT.x0+LOT.x1)/2, lcz=(LOT.z0+LOT.z1)/2;
  rec(160,160,CX,CZ,-.12,new Mat({color:0xd9cfb4,roughness:1}));                                   // areia ao redor
  const grass=canvasTex(256,(g,s)=>{ g.fillStyle='#6f9a4e'; g.fillRect(0,0,s,s); for(let i=0;i<2600;i++){ g.fillStyle=['#5c8a40','#7fae5a','#689447','#8ab866','#567f3b'][i%5]; g.fillRect(Math.random()*s,Math.random()*s,1.5,3+Math.random()*4);} },1.6);
  grass.repeat.set(lw/1.6,ld/1.6);
  rec(lw,ld,lcx,lcz,-.06,new Mat({map:grass,roughness:1}));                                       // gramado do lote
  const conc=canvasTex(256,(g,s)=>{ g.fillStyle='#c4c1ba'; g.fillRect(0,0,s,s); noise(g,s,.07,2500); g.strokeStyle='rgba(0,0,0,.12)'; g.lineWidth=2; g.strokeRect(0,0,s,s); },1.2);
  const concM=t=>{ const c=conc.clone(); c.needsUpdate=true; c.repeat.set(t[0]/1.2,t[1]/1.2); return new Mat({map:c,roughness:.9}); };
  const cw=W-CAL.x0, cd=CAL.z1-CAL.z0;
  const slab=box(cw,.08,cd,(CAL.x0+W)/2,-.085,(CAL.z0+CAL.z1)/2,concM([cw,cd])); slab.castShadow=false;      // calçada da planta
  rec(2.81,1.43,4.465,.715,.003,new Mat({color:0xb9b6af,roughness:.6}));                          // área de serviço
  const pav=canvasTex(128,(g,s)=>{ g.fillStyle='#a9a39a'; g.fillRect(0,0,s,s); noise(g,s,.08,600); g.strokeStyle='#8d877e'; g.lineWidth=3; g.strokeRect(0,0,s,s); g.beginPath(); g.moveTo(s/2,0); g.lineTo(s/2,s); g.stroke(); },.4);
  pav.repeat.set(3.1/.4,5/.4);
  rec(3.1,LOT.z1-CAL.z1,4.15,(CAL.z1+LOT.z1)/2,-.045,new Mat({map:pav,roughness:.85}));           // entrada de carro

let view='orbit';                                   // orbit | top | walk
const orb={t:new THREE.Vector3(CX,0,CZ+.6),th:.62,ph:.82,r:15};
const walk={p:new THREE.Vector3(4.45,1.6,7.9),yaw:.12,pitch:-.08,fov:72,to:null};
function fitR(){ const a=innerWidth/innerHeight; return a<1?Math.min(30,8.5/a+6):14; }
function applyCam(){
  if(view==='walk'){ camera.fov=walk.fov; camera.position.copy(walk.p); camera.rotation.order='YXZ'; camera.rotation.set(walk.pitch,walk.yaw,0); }
  else{ camera.fov=45; const s=Math.sin(orb.ph);
    camera.position.set(orb.t.x+orb.r*s*Math.sin(orb.th),orb.t.y+orb.r*Math.cos(orb.ph),orb.t.z+orb.r*s*Math.cos(orb.th));
    camera.up.set(0,1,0); camera.lookAt(orb.t); }
  camera.updateProjectionMatrix(); inv();
}
function setView(v){

  if(v==='out'){ v='walk'; walk.p.set(1.65,1.6,LOT.z1-.5); walk.yaw=-.22; walk.pitch=.08; walk.to=null; msg='Arraste para olhar · toque no chão para andar'; }

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), ground=new THREE.Plane(new THREE.Vector3(0,1,0),0), tmp=new THREE.Vector3();
function setRay(x,y){ const r=canvas.getBoundingClientRect(); ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera); }
function groundPt(x,y){ setRay(x,y); return ray.ray.intersectPlane(ground,tmp)?tmp.clone():null; }
function visibleWalls(){ return wallMeshes.filter(m=>m.parent.visible); }
function pickItem(x,y){
  setRay(x,y); const hits=ray.intersectObjects(itemsRoot.children,true); if(!hits.length) return null;
  const wh=ray.intersectObjects(visibleWalls(),false); if(wh.length&&wh[0].distance<hits[0].distance-.02) return null;
  let o=hits[0].object; while(o.parent!==itemsRoot) o=o.parent; return o;
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const snap=v=>Math.round(v/.05)*.05;
// encosta o móvel na parede quando chega perto
function wallSnap(it,d){ if(d.flat) return; const c=Math.abs(Math.cos(it.r||0)), s=Math.abs(Math.sin(it.r||0)), hx=(d.w*c+d.d*s)/2, hz=(d.w*s+d.d*c)/2, TH=.13;
  let bx=null, bz=null;
  WR.forEach(r=>{
    if(it.z+hz>r.z0+.02&&it.z-hz<r.z1-.02){ [r.x0-(it.x+hx),r.x1-(it.x-hx)].forEach(dx=>{ if(Math.abs(dx)<TH&&(bx===null||Math.abs(dx)<Math.abs(bx))) bx=dx; }); }
    if(it.x+hx>r.x0+.02&&it.x-hx<r.x1-.02){ [r.z0-(it.z+hz),r.z1-(it.z-hz)].forEach(dz=>{ if(Math.abs(dz)<TH&&(bz===null||Math.abs(dz)<Math.abs(bz))) bz=dz; }); }
  });
  if(bx!==null) it.x+=bx; if(bz!==null) it.z+=bz; }

const ptrs=new Map(); let start=null, drag=null, pinch=null;
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    start={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,btn:e.button,shift:e.shiftKey}; drag=null;
    if(!paintMode&&e.button===0){ const g=pickItem(e.clientX,e.clientY);
      if(g){ select(g); const p=groundPt(e.clientX,e.clientY); if(p) drag={g,ox:p.x-g.position.x,oz:p.z-g.position.z}; start.onItem=true; } }
  }else if(ptrs.size===2){ drag=null; if(start) start.moved=true; const a=[...ptrs.values()];
    pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2}; }
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1&&start){
    if(!start.moved&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>7) start.moved=true;
    if(!start.moved) return;
    if(drag){ const q=groundPt(e.clientX,e.clientY); if(q&&q.distanceTo(camera.position)<60){ const it=drag.g.userData.it;
        it.x=clamp(snap(q.x-drag.ox),LOT.x0+.2,LOT.x1+.1); it.z=clamp(snap(q.z-drag.oz),LOT.z0+.2,LOT.z1-.1); wallSnap(it,drag.g.userData.def); place(drag.g); selBox.setFromObject(drag.g); } return; }
    if(view==='walk'){ walk.yaw+=dx*.0045; walk.pitch=clamp(walk.pitch+dy*.0045,-1.2,1.2); }
    else if(view==='top'||start.btn===2||start.shift) pan(dx,dy);
    else{ orb.th-=dx*.006; orb.ph=clamp(orb.ph-dy*.006,.05,1.5); }
    applyCam();
  }else if(ptrs.size===2&&pinch){ const a=[...ptrs.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
    if(view==='walk') walk.fov=clamp(walk.fov*pinch.d/d,35,95); else{ orb.r=clamp(orb.r*pinch.d/d,2.5,55); pan(mx-pinch.mx,my-pinch.my); }
    pinch={d,mx,my}; applyCam(); }
});
function pan(dx,dy){ const k=orb.r*.0016, s=Math.sin(orb.th), c=Math.cos(orb.th);
  orb.t.x+=(-c*dx - s*dy)*k; orb.t.z+=(s*dx - c*dy)*k; orb.t.x=clamp(orb.t.x,LOT.x0-2,LOT.x1+2); orb.t.z=clamp(orb.t.z,LOT.z0-2,LOT.z1+4); }
function up(e){
  if(!ptrs.has(e.pointerId)) return; const n=ptrs.size; ptrs.delete(e.pointerId);
  if(n===1&&start){ if(drag&&start.moved) save(); if(!start.moved&&performance.now()-start.t<600) tap(e.clientX,e.clientY,start.onItem); start=null; drag=null; }
  if(ptrs.size<2) pinch=null;
}
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{ e.preventDefault(); const f=Math.exp(e.deltaY*.001); if(view==='walk') walk.fov=clamp(walk.fov*f,35,95); else orb.r=clamp(orb.r*f,2.5,55); applyCam(); },{passive:false});

function tap(x,y,onItem){
  if(paintMode){ setRay(x,y); const h=ray.intersectObjects(visibleWalls(),false)[0];
    if(h){ const f=h.face.materialIndex; if(f!==2&&f!==3){ state.paints[h.object.userData.seg+':'+f]=paintColor; buildWalls(); save(); } } return; }
  if(onItem) return;
  if(view==='walk'){ const p=groundPt(x,y); if(p){ const dd=Math.hypot(p.x-walk.p.x,p.z-walk.p.z);
      const wh=ray.intersectObjects(visibleWalls(),false)[0];
      if(dd<16&&!(wh&&wh.distance<p.distanceTo(camera.position)-.05)){ const k=dd>.7?(dd-.6)/dd:0;
        walk.to={x:clamp(walk.p.x+(p.x-walk.p.x)*k,LOT.x0+.4,LOT.x1+.3),z:clamp(walk.p.z+(p.z-walk.p.z)*k,LOT.z0+.4,LOT.z1+3)}; select(null); return; }
      if(wh) hint('Toque no chão visível (passe pelas portas)'); } }
  select(null);
}

  if(!thumbKit){ const sc=new THREE.Scene(); sc.environment=scene.environment; const dl=new THREE.DirectionalLight(0xffffff,1.6); dl.position.set(3,5,4); sc.add(dl); thumbKit={sc,cam:new THREE.PerspectiveCamera(30,1,.05,80)}; }
  const sc=thumbKit.sc, cam=thumbKit.cam, pr=renderer.getPixelRatio(), sz=new THREE.Vector2(); renderer.getSize(sz);
  renderer.setPixelRatio(1); renderer.setSize(176,176,false); renderer.setClearColor(0xfffdf9,1);
  const bb=new THREE.Box3(), c=new THREE.Vector3(), s=new THREE.Vector3();
  list.forEach(d=>{ const g=new THREE.Group(); d.b(g,mainMat(d)); sc.add(g);
    bb.setFromObject(g); bb.getCenter(c); bb.getSize(s); const r=s.length()*.9+.05;
    cam.position.set(c.x+r*.95,c.y+r*.8,c.z+r*1.35); cam.lookAt(c); renderer.render(sc,cam); thumbs[d.id]=canvas.toDataURL('image/png'); sc.remove(g); });
  renderer.setPixelRatio(pr); renderer.setSize(sz.x,sz.y,false); inv();
}
function drawCat(){
  $('#catTabs').innerHTML=''; CATS.forEach(c=>{ const b=document.createElement('button'); b.textContent=c; b.classList.toggle('on',c===curCat); b.onclick=()=>{curCat=c;drawCat();}; $('#catTabs').appendChild(b); });
  const list=DEFS.filter(d=>d.cat===curCat); makeThumbs(list);
  const gr=$('#catGrid'); gr.innerHTML=''; gr.scrollTop=0; list.forEach(d=>{ const b=document.createElement('button');
    b.innerHTML=`<img alt="" src="${thumbs[d.id]}"><b>${d.n}</b><span>${fmt(d.w)} × ${fmt(d.d)} m</span>`;
    b.onclick=()=>addItem(d.id); gr.appendChild(b); });
}
$('#bAdd').onclick=()=>{ setPaint(false); drawCat(); sheet('#catSheet',true); };
function addItem(id){
  let x,z; if(view==='walk'){ x=walk.p.x-Math.sin(walk.yaw)*2; z=walk.p.z-Math.cos(walk.yaw)*2; } else { x=orb.t.x; z=orb.t.z; }
  const d=DEF[id]; if(d.cat==='Externo'&&x>-.5&&x<W&&z>-.5&&z<D+.5){ x=d.w>1.7?4.2:1.4; z=D+2.6; }
  const it={t:id,x:snap(clamp(x,LOT.x0+.6,LOT.x1-.6)),z:snap(clamp(z,LOT.z0+.6,LOT.z1-.6)),r:0}; state.items.push(it); const g=makeObj(it);
  sheet('#catSheet',false); select(g); save(); hint('Arraste o móvel para posicionar');
}

/* ───────── Loop ───────── */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); inv(); }
addEventListener('resize',resize);
let visSig='';
function frame(){
  requestAnimationFrame(frame);
  if(view==='walk'&&walk.to){ const dx=walk.to.x-walk.p.x,dz=walk.to.z-walk.p.z,d=Math.hypot(dx,dz); if(d<.03) walk.to=null; else{ const st=Math.min(d,Math.max(.03,d*.12)); walk.p.x+=dx/d*st; walk.p.z+=dz/d*st; } applyCam(); }
  if(!dirty) return; dirty=false;
  // esconde o que fica entre a câmera e a casa (paredes externas altas e muro), só na maquete
  const o=view==='orbit'&&orb.ph>.3, auto=o&&!state.low&&!state.roof; let sig='';
  const facing=(out,mx,mz)=>(out[0]*(camera.position.x-mx)+out[1]*(camera.position.z-mz))>0;
  wallsRoot.children.forEach(g=>{ const s=g.userData.seg; g.visible=!(auto&&s.out&&facing(s.out,s.dir==='x'?(s.a+s.b)/2:s.c,s.dir==='x'?s.c:(s.a+s.b)/2)); sig+=g.visible?1:0; });
  muroRoot.children.forEach(g=>{ g.visible=state.muro&&!(o&&facing(g.userData.out,g.userData.c[0],g.userData.c[1])); sig+=g.visible?1:0; });
  if(sig!==visSig){ visSig=sig; sun.shadow.needsUpdate=true; }
  renderer.setClearColor(0xcfe0ee,1);
  renderer.render(scene,camera);
}

/* ───────── Início ───────── */
setFloor(state.floor); markFloor(); wallsLabel(); chips();
resize(); orb.r=fitR(); buildWalls(); rebuildItems(); setView('orbit');
if(!state.items.length) hint('Toque em “Móveis” para começar a decorar',false);
window.__casa={state,setView,orb,walk,applyCam,select,itemsRoot,DEFS,makeThumbs,inv,camera};
frame();
})();
</script>
